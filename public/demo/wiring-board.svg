<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t">
  <title id="t">A small distribution board with the cover off: a main switch, a residual current device and six labelled breakers. One breaker is locked off with a padlock and a tag.</title>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4a4036" flood-opacity="0.18"/></filter>
  </defs>
  <rect width="1200" height="900" fill="#ece6dc"/>
  <rect x="150" y="110" width="900" height="680" rx="36" fill="#f6f3ee" filter="url(#sh)"/>
  <rect x="190" y="150" width="820" height="600" rx="22" fill="#e3ded4"/>
  <!-- DIN rails -->
  <rect x="220" y="300" width="760" height="22" fill="#b9c2c8"/>
  <rect x="220" y="560" width="760" height="22" fill="#b9c2c8"/>
  <g font-family="Inter, 'Helvetica Neue', Arial, sans-serif">
    <!-- main switch -->
    <rect x="250" y="210" width="150" height="200" rx="12" fill="#fbfaf8" stroke="#d2ccc1" stroke-width="3"/>
    <rect x="300" y="260" width="50" height="90" rx="8" fill="#d9584a"/>
    <text x="325" y="390" text-anchor="middle" font-size="18" font-weight="600" fill="#1f201d">Main</text>
    <!-- RCD -->
    <rect x="430" y="210" width="190" height="200" rx="12" fill="#fbfaf8" stroke="#d2ccc1" stroke-width="3"/>
    <rect x="470" y="260" width="44" height="80" rx="8" fill="#3a3a38"/>
    <circle cx="570" cy="300" r="20" fill="#e7c94a" stroke="#c8a92c" stroke-width="3"/>
    <text x="570" y="306" text-anchor="middle" font-size="16" font-weight="700" fill="#1f201d">T</text>
    <text x="525" y="390" text-anchor="middle" font-size="18" font-weight="600" fill="#1f201d">RCD 30 mA</text>
    <!-- six breakers -->
    <g>
      <g transform="translate(250 470)"><rect width="100" height="200" rx="10" fill="#fbfaf8" stroke="#d2ccc1" stroke-width="3"/><rect x="32" y="40" width="36" height="70" rx="6" fill="#3a3a38"/><rect x="10" y="140" width="80" height="40" rx="6" fill="#ece6dc"/><text x="50" y="167" text-anchor="middle" font-size="15" font-weight="600" fill="#1f201d">Lights</text></g>
      <g transform="translate(370 470)"><rect width="100" height="200" rx="10" fill="#fbfaf8" stroke="#d2ccc1" stroke-width="3"/><rect x="32" y="40" width="36" height="70" rx="6" fill="#3a3a38"/><rect x="10" y="140" width="80" height="40" rx="6" fill="#ece6dc"/><text x="50" y="167" text-anchor="middle" font-size="15" font-weight="600" fill="#1f201d">Hall</text></g>
      <g transform="translate(490 470)"><rect width="100" height="200" rx="10" fill="#fbfaf8" stroke="#1b6e66" stroke-width="4"/><rect x="32" y="70" width="36" height="70" rx="6" fill="#3a3a38"/><rect x="10" y="150" width="80" height="40" rx="6" fill="#cfe3d9"/><text x="50" y="177" text-anchor="middle" font-size="15" font-weight="700" fill="#1b6e66">Kitchen</text></g>
      <g transform="translate(610 470)"><rect width="100" height="200" rx="10" fill="#fbfaf8" stroke="#d2ccc1" stroke-width="3"/><rect x="32" y="40" width="36" height="70" rx="6" fill="#3a3a38"/><rect x="10" y="140" width="80" height="40" rx="6" fill="#ece6dc"/><text x="50" y="167" text-anchor="middle" font-size="15" font-weight="600" fill="#1f201d">Bath</text></g>
      <g transform="translate(730 470)"><rect width="100" height="200" rx="10" fill="#fbfaf8" stroke="#d2ccc1" stroke-width="3"/><rect x="32" y="40" width="36" height="70" rx="6" fill="#3a3a38"/><rect x="10" y="140" width="80" height="40" rx="6" fill="#ece6dc"/><text x="50" y="167" text-anchor="middle" font-size="15" font-weight="600" fill="#1f201d">Oven</text></g>
      <g transform="translate(850 470)"><rect width="100" height="200" rx="10" fill="#fbfaf8" stroke="#d2ccc1" stroke-width="3"/><rect x="32" y="40" width="36" height="70" rx="6" fill="#3a3a38"/><rect x="10" y="140" width="80" height="40" rx="6" fill="#ece6dc"/><text x="50" y="167" text-anchor="middle" font-size="15" font-weight="600" fill="#1f201d">Spare</text></g>
    </g>
    <!-- padlock on kitchen breaker -->
    <g transform="translate(540 548)">
      <path d="M-22 0 v-26 a22 22 0 0 1 44 0 v26" stroke="#9aa5ad" stroke-width="9" fill="none"/>
      <rect x="-34" y="-2" width="68" height="58" rx="10" fill="#d9584a"/>
      <circle cx="0" cy="24" r="7" fill="#7a2a22"/>
    </g>
    <!-- tag -->
    <path d="M574 600 C640 680 690 720 720 760" stroke="#9aa5ad" stroke-width="3" fill="none"/>
    <g transform="rotate(-8 790 790)" filter="url(#sh)">
      <rect x="700" y="740" width="230" height="96" rx="12" fill="#e7c94a"/>
      <circle cx="722" cy="788" r="8" fill="#ece6dc"/>
      <text x="830" y="780" text-anchor="middle" font-size="20" font-weight="700" fill="#1f201d">Älä kytke</text>
      <text x="830" y="808" text-anchor="middle" font-size="17" fill="#1f201d">Do not switch on</text>
    </g>
  </g>
</svg>
