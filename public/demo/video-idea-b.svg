<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" role="img" aria-label="Still from idea B: a hand-held phone clip of level 12 with one tile left and a question on screen">
  <rect width="360" height="640" fill="#f4efe6"/>
  <text x="180" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="16" fill="#6b6255">Idea B: beat my level</text>
  <g transform="translate(70 120) rotate(-4 110 200)">
    <rect width="220" height="400" rx="28" fill="#222"/>
    <rect x="12" y="20" width="196" height="360" rx="16" fill="#2c3766"/>
    <text x="110" y="58" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">Level 12</text>
    <text x="110" y="82" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="14" fill="#f2c14e">Moves left: 0</text>
    <g transform="translate(35 110)">
      <rect width="150" height="150" rx="12" fill="#1d2440"/>
      <g fill="#4ecdc4"><rect x="10" y="10" width="40" height="40" rx="8"/><rect x="55" y="10" width="40" height="40" rx="8"/><rect x="100" y="10" width="40" height="40" rx="8"/><rect x="10" y="55" width="40" height="40" rx="8"/><rect x="55" y="55" width="40" height="40" rx="8"/><rect x="100" y="55" width="40" height="40" rx="8"/><rect x="10" y="100" width="40" height="40" rx="8"/><rect x="55" y="100" width="40" height="40" rx="8"/></g>
      <rect x="100" y="100" width="40" height="40" rx="8" fill="#ff6b6b"/>
    </g>
    <text x="110" y="300" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#fff">One tile short</text>
  </g>
  <rect x="30" y="540" width="300" height="60" rx="14" fill="#1d2440"/>
  <text x="180" y="577" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#fff">Can you do it in fewer moves?</text>
</svg>
