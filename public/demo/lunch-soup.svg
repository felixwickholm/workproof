    <circle cx="380" cy="390" r="5"/><circle cx="520" cy="420" r="5"/><circle cx="500" cy="560" r="5"/><circle cx="360" cy="520" r="5"/>
  </g>
  <g fill="#e98a3c"><circle cx="395" cy="380" r="8"/><circle cx="540" cy="500" r="8"/><circle cx="350" cy="480" r="7"/></g>
