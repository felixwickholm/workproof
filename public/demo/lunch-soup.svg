<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t">
  <title id="t">Bowl from above: creamy vegetable soup with herbs. A gluten-free crispbread on a separate side plate. A ladle rests in its own labelled pot.</title>
