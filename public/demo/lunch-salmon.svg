<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t">
  <title id="t">Lunch plate from above: baked salmon, boiled potatoes with dill, green salad and lemon. A gluten-free roll on its own side plate with a green label. A blue chopping board and knife kept apart.</title>
  <defs>
    <radialGradient id="plate" cx="50%" cy="45%" r="55%"><stop offset="0" stop-color="#fdfcf9"/><stop offset="1" stop-color="#efebe3"/></radialGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#5a4a36" flood-opacity="0.16"/></filter>
  </defs>
  <rect width="1200" height="900" fill="#efe8dc"/>
  <g opacity="0.35" stroke="#e2d8c7" stroke-width="2">
    <path d="M0 150H1200M0 330H1200M0 510H1200M0 690H1200"/>
  </g>
  <!-- blue board and knife, kept apart -->
  <g filter="url(#sh)" transform="rotate(-8 1040 700)">
    <rect x="930" y="560" width="230" height="330" rx="22" fill="#5b7fa6"/>
    <rect x="950" y="580" width="190" height="290" rx="14" fill="#6b8fb5"/>
    <circle cx="1045" cy="595" r="9" fill="#4a6a8e"/>
  </g>
  <g transform="rotate(-8 1040 700)">
    <rect x="1010" y="640" width="18" height="150" rx="4" fill="#d9dde1"/>
    <path d="M1010 640 Q1019 600 1028 640Z" fill="#d9dde1"/>
    <rect x="1006" y="790" width="26" height="80" rx="8" fill="#2f3a44"/>
  </g>
  <!-- main plate -->
  <circle cx="520" cy="450" r="330" fill="url(#plate)" filter="url(#sh)"/>
  <circle cx="520" cy="450" r="262" fill="none" stroke="#e5e0d6" stroke-width="3"/>
  <!-- salad -->
  <g>
    <ellipse cx="420" cy="330" rx="120" ry="95" fill="#7fa65a"/>
    <path d="M330 320 q40 -60 90 -20 q30 -50 80 0 q40 10 20 60 q-30 50 -90 40 q-60 20 -95 -30z" fill="#93b96b"/>
    <path d="M360 300 q30 30 70 10 M400 360 q30 -20 70 0 M350 345 q20 15 40 5" stroke="#5f8a42" stroke-width="5" fill="none" stroke-linecap="round"/>
    <circle cx="470" cy="300" r="16" fill="#d9584a"/><circle cx="380" cy="370" r="13" fill="#d9584a"/><circle cx="455" cy="380" r="10" fill="#e7bf5a"/>
  </g>
  <!-- salmon -->
  <g transform="rotate(-18 610 500)">
    <rect x="510" y="440" width="230" height="130" rx="40" fill="#e3875f"/>
    <rect x="522" y="452" width="206" height="106" rx="32" fill="#ee9f78"/>
    <path d="M560 455 q-14 50 0 100 M610 455 q-14 50 0 100 M660 455 q-14 50 0 100 M705 460 q-12 45 0 90" stroke="#fbd2b8" stroke-width="7" fill="none" stroke-linecap="round"/>
    <path d="M522 470 q100 -30 206 0" stroke="#c76a45" stroke-width="5" fill="none" opacity="0.6"/>
  </g>
  <!-- lemon -->
  <g transform="translate(70 -70)">
  <path d="M705 360 a70 70 0 0 1 -60 120 z" fill="#f2d468"/>
  <path d="M700 372 a55 55 0 0 1 -45 95 z" fill="#f8e494"/>
  <path d="M685 400 l-28 60 M693 425 l-36 35" stroke="#f2d468" stroke-width="4"/>
  </g>
  <!-- potatoes -->
  <g>
    <ellipse cx="380" cy="560" rx="62" ry="50" fill="#e4c47a"/><ellipse cx="372" cy="552" rx="46" ry="34" fill="#efd48e"/>
    <ellipse cx="470" cy="620" rx="58" ry="47" fill="#e4c47a"/><ellipse cx="462" cy="612" rx="42" ry="31" fill="#efd48e"/>
    <ellipse cx="335" cy="460" rx="45" ry="40" fill="#e4c47a"/><ellipse cx="330" cy="454" rx="32" ry="27" fill="#efd48e"/>
    <g stroke="#5f8a42" stroke-width="4" stroke-linecap="round">
      <path d="M360 545 l10 -8 M385 560 l9 6 M455 605 l10 -9 M478 622 l8 7 M325 450 l9 -7 M340 465 l6 8 M400 540 l6 -9"/>
    </g>
  </g>
  <!-- gluten-free side plate -->
  <circle cx="1000" cy="250" r="130" fill="url(#plate)" filter="url(#sh)"/>
  <circle cx="1000" cy="250" r="100" fill="none" stroke="#e5e0d6" stroke-width="3"/>
  <ellipse cx="995" cy="245" rx="70" ry="56" fill="#c4914f"/>
  <ellipse cx="990" cy="238" rx="56" ry="42" fill="#d6a865"/>
  <path d="M955 230 q35 -18 70 0 M960 252 q30 -14 60 0" stroke="#b07d40" stroke-width="5" fill="none" stroke-linecap="round"/>
  <g transform="rotate(6 1000 395)">
    <rect x="925" y="372" width="150" height="46" rx="12" fill="#5f8f5a"/>
    <text x="1000" y="402" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="600" fill="#ffffff">Gluten-free</text>
  </g>
</svg>
