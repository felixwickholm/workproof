<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="t">
  <title id="t">Phone-sized appointment reminder in Finnish with English under each line: fasting blood sample on Tuesday 18 November at 8.15, Rantakaari 9 B, laboratory on the 2nd floor, and one large button to call and change the time.</title>
  <style>
    .f { font-family: Inter, 'Helvetica Neue', Arial, sans-serif; }
    .fi { fill: #1f201d; }
    .en { fill: #6b6b68; }
    .ic { fill: none; stroke: #1b6e66; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <rect width="390" height="844" rx="44" fill="#f6f6f4"/>
  <g class="f">
    <!-- status bar -->
    <text x="34" y="44" font-size="15" font-weight="600" class="fi">9.41</text>
    <rect x="322" y="33" width="26" height="13" rx="3.5" fill="none" stroke="#1f201d" stroke-width="1.5"/><rect x="325" y="36" width="18" height="7" rx="2" fill="#1f201d"/>
    <!-- header -->
    <text x="24" y="104" font-size="15" font-weight="600" fill="#1b6e66">Terveysasema · Health station</text>
    <text x="24" y="146" font-size="28" font-weight="700" class="fi">Sinulla on aika</text>
    <text x="24" y="174" font-size="17" class="en">You have an appointment</text>

    <!-- calendar block -->
    <rect x="16" y="200" width="358" height="190" rx="22" fill="#ffffff" stroke="#eaeaea"/>
    <rect x="40" y="226" width="78" height="86" rx="14" fill="#1b6e66"/>
    <text x="79" y="252" text-anchor="middle" font-size="14" font-weight="600" fill="#cfe7e3">marras</text>
    <text x="79" y="294" text-anchor="middle" font-size="38" font-weight="700" fill="#ffffff">18</text>
    <text x="138" y="250" font-size="17" font-weight="600" class="fi">tiistai</text>
    <text x="138" y="270" font-size="14" class="en">Tuesday 18 November</text>
    <text x="138" y="304" font-size="34" font-weight="700" class="fi">klo 8.15</text>
    <line x1="40" y1="334" x2="350" y2="334" stroke="#eaeaea"/>
    <text x="40" y="358" font-size="15" font-weight="600" class="fi">Verinäyte, syömättä</text>
    <text x="40" y="377" font-size="13" class="en">Fasting blood sample</text>

    <!-- address -->
    <rect x="16" y="406" width="358" height="104" rx="22" fill="#ffffff" stroke="#eaeaea"/>
    <path class="ic" d="M50 430 c-10 0 -17 7 -17 17 c0 13 17 29 17 29 s17 -16 17 -29 c0 -10 -7 -17 -17 -17z"/>
    <circle class="ic" cx="50" cy="446" r="5"/>
    <text x="86" y="442" font-size="16" font-weight="600" class="fi">Rantakaari 9 B, Espoo</text>
    <text x="86" y="466" font-size="16" font-weight="600" class="fi">Laboratorio, 2. kerros</text>
    <text x="86" y="488" font-size="13" class="en">Laboratory, 2nd floor</text>

    <!-- before you come -->
    <rect x="16" y="522" width="358" height="176" rx="22" fill="#ffffff" stroke="#eaeaea"/>
    <text x="40" y="554" font-size="13" font-weight="600" fill="#92400e">Ennen tuloa · Before you come</text>
    <circle cx="48" cy="590" r="4" fill="#1b6e66"/>
    <text x="62" y="588" font-size="15" font-weight="600" class="fi">Älä syö 10 tuntiin. Vettä saa juoda.</text>
    <text x="62" y="606" font-size="13" class="en">No food for 10 hours. Water is fine.</text>
    <circle cx="48" cy="632" r="4" fill="#1b6e66"/>
    <text x="62" y="630" font-size="15" font-weight="600" class="fi">Ota henkilökortti mukaan.</text>
    <text x="62" y="648" font-size="13" class="en">Bring an ID card.</text>
    <circle cx="48" cy="674" r="4" fill="#1b6e66"/>
    <text x="62" y="672" font-size="15" font-weight="600" class="fi">Tule 10 minuuttia aikaisemmin.</text>
    <text x="62" y="690" font-size="13" class="en">Arrive 10 minutes early.</text>

    <!-- button -->
    <rect x="16" y="712" width="358" height="72" rx="22" fill="#1b6e66"/>
    <path d="M44 733 h8 l5 10 l-6 4 a22 22 0 0 0 10 10 l4 -6 l10 5 v8 a3 3 0 0 1 -3 3 a31 31 0 0 1 -31 -31 a3 3 0 0 1 3 -3z" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linejoin="round"/>
    <text x="92" y="743" font-size="18" font-weight="700" fill="#ffffff">Soita ja siirrä aika</text>
    <text x="92" y="765" font-size="14" fill="#cfe7e3">Call to change the time</text>
    <text x="195" y="808" text-anchor="middle" font-size="13" class="en">09 000 1234 · ma–pe 8–15 · Mon–Fri 8–15</text>
    <rect x="128" y="826" width="134" height="5" rx="2.5" fill="#1f201d"/>
  </g>
</svg>
