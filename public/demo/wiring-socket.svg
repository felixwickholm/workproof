<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="t">
  <title id="t">An open wall box with a double socket. Brown, blue and green-yellow wires are stripped to the same length and fixed in the terminals. A voltage tester next to it shows 0 V.</title>
  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#4a4036" flood-opacity="0.18"/></filter>
    <pattern id="gy" width="24" height="24" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="24" height="24" fill="#7fb04f"/><rect width="12" height="24" fill="#e7c94a"/></pattern>
  </defs>
  <rect width="1200" height="900" fill="#ece6dc"/>
  <rect x="0" y="0" width="1200" height="900" fill="#e6dfd2" opacity="0.6"/>
  <!-- wall box -->
  <rect x="210" y="170" width="560" height="560" rx="40" fill="#f6f3ee" filter="url(#sh)"/>
  <rect x="250" y="210" width="480" height="480" rx="28" fill="#d9d4cb"/>
  <rect x="270" y="230" width="440" height="440" rx="22" fill="#cdc7bc"/>
  <!-- cables entering from top -->
  <rect x="440" y="60" width="100" height="190" rx="40" fill="#efece6" stroke="#d5d0c6" stroke-width="3"/>
  <!-- three wires per socket -->
  <g stroke-linecap="round" fill="none" stroke-width="22">
    <path d="M460 230 C440 300 360 320 350 400" stroke="#8a5a34"/>
    <path d="M490 230 C490 300 470 330 470 400" stroke="#3f6fa8"/>
    <path d="M520 230 C540 300 600 320 610 400" stroke="url(#gy)"/>
  </g>
  <!-- stripped ends (copper), same length -->
  <g stroke="#c98a4a" stroke-width="10" stroke-linecap="round">
    <path d="M350 400 v34"/><path d="M470 400 v34"/><path d="M610 400 v34"/>
  </g>
  <!-- socket body -->
  <rect x="290" y="430" width="400" height="220" rx="26" fill="#fbfaf8" stroke="#dcd7ce" stroke-width="3"/>
  <g fill="#cfc9be"><rect x="330" y="436" width="40" height="20" rx="5"/><rect x="450" y="436" width="40" height="20" rx="5"/><rect x="590" y="436" width="40" height="20" rx="5"/></g>
  <g fill="#9a9488"><circle cx="350" cy="446" r="7"/><circle cx="470" cy="446" r="7"/><circle cx="610" cy="446" r="7"/></g>
  <circle cx="395" cy="560" r="62" fill="#f1eee9" stroke="#e0dbd2" stroke-width="3"/>
  <circle cx="585" cy="560" r="62" fill="#f1eee9" stroke="#e0dbd2" stroke-width="3"/>
  <g fill="#3a3a38"><circle cx="372" cy="560" r="9"/><circle cx="418" cy="560" r="9"/><circle cx="562" cy="560" r="9"/><circle cx="608" cy="560" r="9"/></g>
  <g fill="#b8b2a6"><rect x="389" y="503" width="12" height="14" rx="3"/><rect x="389" y="603" width="12" height="14" rx="3"/><rect x="579" y="503" width="12" height="14" rx="3"/><rect x="579" y="603" width="12" height="14" rx="3"/></g>
  <!-- tester -->
  <g transform="rotate(14 960 520)" filter="url(#sh)">
    <rect x="890" y="300" width="150" height="380" rx="36" fill="#2f3a44"/>
    <rect x="910" y="330" width="110" height="120" rx="14" fill="#cfe3d9"/>
    <text x="965" y="408" text-anchor="middle" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="700" fill="#1b6e66">0 V</text>
    <circle cx="965" cy="500" r="22" fill="#1b6e66"/>
    <circle cx="935" cy="560" r="10" fill="#9aa5ad"/><circle cx="995" cy="560" r="10" fill="#9aa5ad"/>
    <rect x="955" y="680" width="20" height="90" rx="6" fill="#d9584a"/>
    <rect x="961" y="770" width="8" height="40" rx="4" fill="#c9ced3"/>
  </g>
</svg>
